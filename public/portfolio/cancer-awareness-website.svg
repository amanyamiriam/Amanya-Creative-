  <rect x="100" y="155" width="700" height="145" rx="18" fill="#f7e6e2"/><text x="135" y="205" fill="#8e3b46" font-family="Arial,sans-serif" font-size="32" font-weight="700">Know the facts about cancer</text><text x="135" y="244" fill="#71565a" font-family="Arial,sans-serif" font-size="18">Information can help people recognize symptoms, seek care and</text><text x="135" y="272" fill="#71565a" font-family="Arial,sans-serif" font-size="18">support loved ones through every step.</text>
  <circle cx="185" cy="390" r="65" fill="#8e3b46"/><path d="M185 350v80M145 390h80" stroke="#fff" stroke-width="14" stroke-linecap="round"/><text x="280" y="375" fill="#8e3b46" font-family="Arial,sans-serif" font-size="21" font-weight="700">What is cancer?</text><text x="280" y="407" fill="#71565a" font-family="Arial,sans-serif" font-size="17">Understand types, risk factors</text><text x="280" y="432" fill="#71565a" font-family="Arial,sans-serif" font-size="17">and treatment options.</text>
  <rect x="600" y="350" width="160" height="90" rx="14" fill="#f4c95d"/><text x="635" y="388" fill="#8e3b46" font-family="Arial,sans-serif" font-size="18" font-weight="700">Early action</text><text x="630" y="416" fill="#8e3b46" font-family="Arial,sans-serif" font-size="16">saves lives</text>
